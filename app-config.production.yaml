app:
  title: polarpoint
  baseUrl: https://platform.polarpoint.io

organization:
  name: Polarpoint

backend:
  baseUrl: https://platform.polarpoint.io
  listen:
    port: 7007
    host: 0.0.0.0
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    img-src: ["'self'", 'data:', 'https://avatars.githubusercontent.com']
  cors:
    origin: https://platform.polarpoint.io
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${AUTH_GITHUB_CLIENT_ID}
          clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

auth:
  environment: production
  providers:
    guest: null
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

permission:
  rbac:
    admin:
      superUsers:
        - name: user:default/bainss
    defaultPermissions:
      defaultRole: role:default/authenticated-read
      basicPermissions:
        - permission: catalog.entity.read
          action: read
        - permission: catalog-entity
          action: read
    pluginsWithPermission:
      - catalog
      - scaffolder
      - permission
      - kubernetes

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: ${K8S_URL}
          name: tooling
          authProvider: serviceAccount
          skipTLSVerify: true
          skipMetricsLookup: true
          serviceAccountToken: ${K8S_TOKEN}
        - url: ${K8S_CONTROLLER_URL}
          name: controller
          authProvider: serviceAccount
          skipTLSVerify: true
          skipMetricsLookup: true
          serviceAccountToken: ${K8S_CONTROLLER_TOKEN}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

scaffolder:
  defaultAuthor:
    name: ':robot: [backstage-bot]'
    email: mail@polarpoint.io

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [API, Component, Domain, Group, System, User, Template, Resource, Location]
  locations:
    - type: url
      target: https://github.com/polarpoint-io/backstage-catalog/blob/main/all.yaml
  providers:
    github:
      polarpointIo:
        organization: 'polarpoint-io'
        catalogPath: '/catalog-info.yaml'
        filters:
          branch: 'main'
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }

crossplane:
  enablePermissions: false

kubernetesIngestor:
  ingestAPIsAsCRDs: true
  mappings:
    namespaceModel: 'cluster'
    nameModel: 'name-cluster'
    titleModel: 'name'
    systemModel: 'namespace'
    referencesNamespaceModel: 'default'
  components:
    enabled: true
    excludedNamespaces: [kube-public, kube-system, kube-node-lease]
    taskRunner:
      frequency: 10
      timeout: 600
  crossplane:
    enabled: true
    claims:
      ingestAllClaims: true
    xrds:
      enabled: true
      publishPhase:
        allowedTargets: ['github.com']
        target: github
        git:
          repoUrl: github.com?owner=polarpoint-io&repo=backstage-software-templates
          targetBranch: main
        allowRepoSelection: true
      taskRunner:
        frequency: 10
        timeout: 600
  argoIntegration: true
